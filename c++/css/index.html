<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"  href="style.css">

    <title>form</title>
</head>
<body>

    <section>
        <form action="">

            <div class = "form-group">
            <label for="name">Name :- <sup>* </sup></label>  <!--superset-->
            <input type ="text" id="name" required>
            </div>


            <div class="form-group">
                <label for="sname">sName :-</label>
                <input type ="text" value="Kendre" id="sname" readonly disabled> <!--placeholder with name can be used -->
            </div>


            <div class="form-group">
                <label for="">password :-</label>
                <input type ="password">
            </div>

            <div class="form-group">
                <label for="">Number :-</label>
                <input type ="number">
            </div>

            <div class="form-group">
                <label for="">Email :-</label>
                <input type ="email">
            </div>

            <div class="form-group">
                <label for="">Phone(xxx-xxx-xxxx) :-</label>
                <input type ="text" pattern="\d{3}-\d{3}-\d{4}" maxlength="10">
            </div>

            <div class="form-group">
                <label for="">Age:-</label>
                <input type ="number" name="age"  min="18" max="75">
            </div>

            <div class="form-group">
                <label for="">Gender </label>

                <label for="">Male :-</label>
                <input type ="radio" name="Gender">

                <label for="">Female :-</label>
                <input type ="radio" name="Gender">


            </div>

            <div class="form-group">
                <label for="">Subject </label>

                <label for="">Phy :-</label>
                <input type ="checkbox" >

                <label for="">Chem :-</label>
                <input type ="checkbox" >

                <labe for="">bio :-</labe>
                <input type = "checkbox">


            </div>

            
            <div class="form-group">
                <textarea cols="30px"  rows="10" maxlength="50"></textarea>

            </div>

            <div class="form-group">
                <select name="" id="">
                    <option value="">select</option>
                    <option value="mumbai">Mumbai</option>
                    <option value="pune">Pune</option>
                    <option value="thane">Thane</option>
                    <option value="">select</option>


                </select>
            </div>

            <div class="form-group">
                <label for="file">Document :-</label>
                <input type ="file" id="file">
            </div>

            <div class="form-group">
                <label for="birth">Birth Date</label>
                <input type="date" id="birth">
            </div>

            <div class="form-group">
                <label for="exam">Exam Date</label>
                <input type="date" id="exam">
            </div>
            

            <div class="form-group">
                <label for="month">Month</label>
                <input type="month" id="month">
            </div>

            <div class="form-group">
                <label for="week">Week</label>
                <input type="week" id="week">
            </div>
            
            <div class="form-group">
                <label for="time">Time</label>
                <input type="time" id="time">
            </div>
           
            <div class="form-group">
                <label for="ramge">Range</label>
                <input type="range" id="range">
            </div>

            <div class="form-group">
                <label for="colour">Colour</label>
                <input type="color" id="colour">
            </div>
        
            <div class="form-group">
                <label for="search">Search</label>
                <input type="search" id="search">
            </div>
        
            <div class="form-group">
                <label for="tele">Telephone</label>
                <input type="tel" id="tele">
            </div>

            <div class="form-group">
                <label for="url">Link</label>
                <input type="url" id="url">
            </div>

            <div class="form-group">
                <label for="">progress bar</label>
                <progress value="30" max="100"></progress>
            </div>
        
            <div class="form-group">
                <label for="">Submit</label>
                <input type="submit" value="save">
                <input type="reset">
            </div>
        

            <p>h<sub>2</sub>o</p>  <!--subset-->
        
        </form>
        
     </section>
    




    <script src="app.js"></script>
</body>
</html>
